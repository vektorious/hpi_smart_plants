<svg xmlns="http://www.w3.org/2000/svg" width="210" height="106" viewBox="0 0 210 106" role="img" aria-labelledby="title desc">
  <title id="title">Open Source Licenses</title>
  <desc id="desc">Table listing hardware, software, and documentation licenses.</desc>
  <rect width="210" height="106" fill="#f8f8f8"/>
  <rect x="1.5" y="1.5" width="207" height="103" fill="#ffffff" stroke="#2f2f2f" stroke-width="3"/>
  <text x="10" y="24" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111">Open Source Licenses</text>
  <line x1="6" y1="31" x2="204" y2="31" stroke="#2f2f2f" stroke-width="1"/>
  <line x1="6" y1="55" x2="204" y2="55" stroke="#2f2f2f" stroke-width="1"/>
  <line x1="6" y1="79" x2="204" y2="79" stroke="#2f2f2f" stroke-width="1"/>
  <line x1="112" y1="31" x2="112" y2="79" stroke="#2f2f2f" stroke-width="1"/>
  <text x="8" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Hardware</text>
  <text x="114" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111111">CERN-OHL-W-2.0</text>
  <text x="8" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Software</text>
  <text x="176" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#111111">MIT</text>
  <text x="8" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Documentation</text>
  <text x="200" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#111111">CC-BY-4.0</text>
</svg>
